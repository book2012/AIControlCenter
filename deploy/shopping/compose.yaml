name: ai-shopping

services:
  database:
    image: mariadb:11.4.12
    container_name: shopping-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${SHOPPING_DB_NAME}
      MARIADB_USER: ${SHOPPING_DB_USER}
      MARIADB_PASSWORD: ${SHOPPING_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${SHOPPING_DB_ROOT_PASSWORD}
    volumes:
      - shopping_database:/var/lib/mysql
    networks:
      - shopping_internal
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  wordpress:
    image: wordpress:php8.3-apache
    container_name: shopping-wordpress
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${SHOPPING_WORDPRESS_PORT}:80"
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: ${SHOPPING_DB_NAME}
      WORDPRESS_DB_USER: ${SHOPPING_DB_USER}
      WORDPRESS_DB_PASSWORD: ${SHOPPING_DB_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_MEMORY_LIMIT', '256M');
        define('WP_MAX_MEMORY_LIMIT', '512M');
        define('DISALLOW_FILE_EDIT', true);
    volumes:
      - shopping_wordpress:/var/www/html
      - ./wordpress/plugins/ai-shopping-storefront:/var/www/html/wp-content/plugins/ai-shopping-storefront:ro
    networks:
      - shopping_internal
      - shopping_external
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD-SHELL
        - php -r '$$s=@fsockopen("127.0.0.1",80,$$e,$$m,3); if(!$$s){exit(1);} fclose($$s);'
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  wordpress-cli:
    image: wordpress:cli
    profiles:
      - tools
    depends_on:
      database:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: ${SHOPPING_DB_NAME}
      WORDPRESS_DB_USER: ${SHOPPING_DB_USER}
      WORDPRESS_DB_PASSWORD: ${SHOPPING_DB_PASSWORD}
    volumes:
      - shopping_wordpress:/var/www/html
    networks:
      - shopping_internal
      - shopping_external

  caddy:
    image: caddy:2-alpine
    container_name: shopping-caddy
    restart: unless-stopped
    depends_on:
      wordpress:
        condition: service_healthy
    ports:
      - "8081:80"
      - "8443:443"
      - "8443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - shopping_caddy_data:/data
      - shopping_caddy_config:/config
    networks:
      - shopping_external

networks:
  shopping_internal:
    name: ai-shopping-internal
    internal: true

  shopping_external:
    name: ai-shopping-network

volumes:
  shopping_database:
    name: ai-shopping-database

  shopping_wordpress:
    name: ai-shopping-wordpress

  shopping_caddy_data:
    name: ai-shopping-caddy-data

  shopping_caddy_config:
    name: ai-shopping-caddy-config
