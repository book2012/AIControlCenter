<li class="product-card" data-product-id="{{id}}">
  <a class="product-link" href="{{href}}" aria-label="상품 이미지와 해시태그 미리보기">
    <div class="product-photo">
      <img width="800" height="1200" loading="lazy" decoding="async" alt="{{name}}" {{image_attrs}}>
      <span class="photo-fallback" {{fallback_hidden}}>이미지 준비 중입니다.</span>
    </div>
    <div class="product-caption"><p class="product-tags">{{tags}}</p>{{sale_price}}</div>
  </a>
</li>
