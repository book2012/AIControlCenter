<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="agachichi — 내 주문, 환불 및 사이즈교환">
  <title>내 주문 | agachichi</title>
  <link rel="stylesheet" href="/homepage/assets/storefront.css">
  <script src="/homepage/assets/storefront-orders.js" defer></script>
</head>
<body data-server-rendered="true">
  <a class="skip-link" href="#main-content">본문 바로가기</a>
  <header class="store-header">
    <a class="wordmark" id="store-home-link" href="/homepage/storefront" aria-label="agachichi 홈">agachichi<span>Everyday Comfort, Playful Touch</span></a>
    <nav class="header-actions" aria-label="쇼핑 메뉴">
      <a class="header-search" href="/homepage/storefront/search">검색 <span aria-hidden="true">↗</span></a>
      <a class="header-cart" href="/homepage/storefront/cart" aria-label="장바구니">장바구니</a><a class="header-orders" href="/homepage/storefront/my-orders" aria-current="page">ORDER</a>
    </nav>
    <p class="preview-notice">주문 · 환불 · 사이즈교환</p>
  </header>
  <main id="main-content" tabindex="-1" class="orders-page">
    <a class="text-button back-link" href="/homepage/storefront">← 쇼핑 계속하기</a>
    <div class="orders-heading"><p class="eyebrow">MY ORDERS</p><h1>주문 조회</h1><p>주문번호와 주문 시 인증한 휴대폰 번호로 조회하세요.</p></div>
    <section class="orders-panel"><label>주문번호<input id="orders-number" inputmode="numeric" maxlength="12" placeholder="문자로 받은 주문번호"></label><label>주문 휴대폰 번호<input id="lookup-phone" type="tel" autocomplete="tel" maxlength="32" placeholder="01012345678"></label><button id="orders-lookup" type="button">주문 조회</button></section>
    <section id="orders-auth" class="orders-panel" hidden>
      <h2>휴대폰 인증</h2>
      <label>휴대폰 번호<input id="orders-phone" type="tel" autocomplete="tel" maxlength="32" placeholder="01012345678"></label>
      <label class="commerce-consent"><input id="orders-consent" type="checkbox">인증 문자 수신 동의</label>
      <button id="orders-send" type="button">인증문자 받기</button>
      <label>인증번호<input id="orders-code" inputmode="numeric" autocomplete="one-time-code" maxlength="10"></label>
      <button id="orders-check" type="button">인증 확인</button>
    </section>
    <p id="orders-message" role="status" aria-live="polite"></p>
    <section id="orders-list" aria-live="polite"></section>
  </main>
  <footer class="store-footer"><a class="wordmark" href="/homepage/storefront">agachichi</a><p>Everyday Comfort, Playful Touch</p><span>주문과 사후처리를 한 곳에서 확인하세요.</span></footer>
</body>
</html>
