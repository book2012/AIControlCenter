const history=[],box=document.querySelector('#messages'),prompt=document.querySelector('#prompt'),send=document.querySelector('#send'),error=document.querySelector('#error'),pet=document.querySelector('#character');let busy=false,celebration;const root=document.querySelector('.companion-scene');if(localStorage.getItem('mongle-reduce-motion')==='true'||matchMedia('(prefers-reduced-motion: reduce)').matches)root.classList.add('motion-off');document.querySelector('#motion').onclick=()=>{root.classList.toggle('motion-off');localStorage.setItem('mongle-reduce-motion',String(root.classList.contains('motion-off')));};

document.querySelector('#form').onsubmit=async event=>{event.preventDefault();if(busy||!prompt.value.trim())return;const text=prompt.value.trim();const current=[...history.slice(-6),{role:'user',content:text}];if(current.reduce((n,m)=>n+m.content.length,0)>12000){error.textContent='대화가 길어졌어요. 새로고침해서 새 대화를 시작해주세요.';return;}busy=true;send.disabled=true;prompt.disabled=true;pet.className='companion-character mood-thinking';error.textContent='답변을 준비하고 있어요…';try{const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:current})});const data=await response.json();if(!response.ok)throw Error(data.error==='assistant_busy'?'다른 요청을 처리 중이에요. 잠시 뒤 다시 보내주세요.':'응답을 받지 못했어요. 입력을 확인해주세요.');show('user',text);show('assistant',data.content);history.splice(0,history.length,...current,{role:'assistant',content:data.content});prompt.value='';error.textContent='';happy();}catch(e){pet.className='companion-character mood-idle';error.textContent=e.message||'연결을 확인해주세요.';}finally{busy=false;send.disabled=false;prompt.disabled=false;prompt.focus();}};
