# Controlled runtime: no access/error request context reaches log sinks.
# This replaces the default virtual host; effective modules still need attestation.
ErrorLog /dev/null
<VirtualHost *:80>
    DocumentRoot /var/www/html
    CustomLog /dev/null common
    ErrorLog /dev/null
    <Directory /var/www/html>
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
</VirtualHost>
